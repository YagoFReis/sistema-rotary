<div class="mb-3">
  <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">{{ campo.label }}{% if campo.field.required %} <span class="obrigatorio" aria-hidden="true">*</span><span class="visually-hidden">(obrigatório)</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
  {% for erro in campo.errors %}
    <div class="erro-campo" role="alert"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i> {{ erro }}</div>
  {% endfor %}
</div>
