name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotary
          POSTGRES_USER: rotary
          POSTGRES_PASSWORD: rotary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: chave-somente-para-ci
      DB_ENGINE: postgres
      DB_NAME: rotary
      DB_USER: rotary
      DB_PASSWORD: rotary
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar configuração do projeto
        run: python manage.py check

      - name: Verificar se há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes
        run: python manage.py test
